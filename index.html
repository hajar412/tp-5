<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="task-container">
      <header>
        <h1>Tasks</h1>
        <h3>Your tasks for the day</h3>
        <p id="task-count">0 tasks</p>
    </header>

    <button id="add-task-button">Add Task</button>
    <input type="text" hidden id="task-input" placeholder="Enter a new task">
    <ul id="task-list"></ul>
</div>

    <div id="timer-container">
      <h2>Pomodoro Timer</h2>
      <div id="timer-display">25:00</div>
      <div id="timer-controls">
        <button id="start-timer-button">Start</button>
        <button id="reset-timer-button">Reset</button>
      </div>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
